# Render blueprint. The free tier is enough: the whole 16,673-ship register
# occupies ~14 MB resident, well inside the 512 MB free instance.
#
# Free instances sleep after ~15 min idle (~50 s to wake) and have an
# EPHEMERAL disk: anything the app writes locally is lost on every restart.
# That is why keys and suppressions are supplied as environment variables
# below rather than relying on files.
services:
  - type: web
    name: carbonkeel
    runtime: python
    plan: free
    region: frankfurt          # EU customers, EU data
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # One trusted proxy (Render's) sits in front of the app. Without this,
      # every visitor appears to share the proxy's address and the fair-use
      # limit would lock the whole site out after ~120 lookups.
      # If you later put Cloudflare's orange-cloud proxy in front of
      # app.carbonkeel.com, change this to 2 (or leave the record DNS-only).
      - key: CARBONKEEL_PROXY_HOPS
        value: "1"
      # Operator-tool access keys, "key:label,key2:label2". You choose and
      # see these; they are NOT in git. Set the value in the Render dashboard.
      - key: CARBONKEEL_ACCESS_KEYS
        sync: false
      # IMOs whose operators asked us to hide our derived figures, e.g.
      # "9463633, 9448047". The durable copy of every suppression.
      - key: CARBONKEEL_SUPPRESSED_IMOS
        sync: false
